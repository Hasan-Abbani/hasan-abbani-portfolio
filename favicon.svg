<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Hasan Abbani monogram</title>
  <desc id="desc">A minimalistic HA monogram in teal on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f1219"/>
      <stop offset="1" stop-color="#060913"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" fill="url(#bg)"/>
  
  <!-- Subtle accent border -->
  <rect x="1" y="1" width="62" height="62" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.2"/>
  
  <!-- HA monogram text -->
  <text x="32" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#2dd4bf" letter-spacing="-1">HA</text>
</svg>
